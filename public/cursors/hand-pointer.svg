<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 8-Bit Pixel Sparkle at Fingertip -->
  <g fill="#fde047">
    <rect x="7" y="0" width="2" height="2" />
    <rect x="5" y="2" width="6" height="2" />
    <rect x="7" y="4" width="2" height="2" />
  </g>
  <rect x="7" y="2" width="2" height="2" fill="#ffffff" />

  <!-- 8-Bit Pixel Drop Shadow -->
  <g fill="#2c2a26" opacity="0.3">
    <rect x="8" y="6" width="4" height="2" />
    <rect x="6" y="8" width="8" height="6" />
    <rect x="6" y="14" width="14" height="4" />
    <rect x="4" y="18" width="18" height="6" />
    <rect x="6" y="24" width="14" height="4" />
    <rect x="8" y="28" width="10" height="4" />
  </g>

  <!-- Black Pixel Outline -->
  <g fill="#2c2a26">
    <!-- Index tip -->
    <rect x="6" y="4" width="4" height="2" />
    <!-- Index left -->
    <rect x="4" y="6" width="2" height="10" />
    <!-- Index right -->
    <rect x="10" y="6" width="2" height="6" />
    <!-- Middle finger top border -->
    <rect x="12" y="10" width="4" height="2" />
    <rect x="16" y="12" width="2" height="2" />
    <!-- Ring finger top border -->
    <rect x="18" y="14" width="2" height="2" />
    <!-- Pinky top border -->
    <rect x="20" y="16" width="2" height="4" />
    <!-- Right side border -->
    <rect x="20" y="20" width="2" height="4" />
    <!-- Bottom right curves -->
    <rect x="18" y="24" width="2" height="2" />
    <rect x="16" y="26" width="2" height="2" />
    <!-- Cuff right border -->
    <rect x="14" y="28" width="2" height="4" />
    <!-- Cuff bottom border -->
    <rect x="8" y="30" width="6" height="2" />
    <!-- Cuff left border -->
    <rect x="6" y="28" width="2" height="4" />
    <!-- Thumb bottom/left -->
    <rect x="4" y="26" width="2" height="2" />
    <rect x="2" y="22" width="2" height="4" />
    <rect x="2" y="18" width="2" height="4" />
    <rect x="4" y="16" width="2" height="2" />
    <!-- Inner finger divider lines -->
    <rect x="10" y="14" width="2" height="6" />
    <rect x="14" y="16" width="2" height="4" />
    <rect x="18" y="18" width="2" height="4" />
  </g>

  <!-- Cream White Pixel Hand Fill -->
  <g fill="#fdfaf6">
    <!-- Index finger -->
    <rect x="6" y="6" width="4" height="10" />
    <!-- Upper palm / fingers -->
    <rect x="10" y="12" width="2" height="2" />
    <rect x="12" y="12" width="4" height="4" />
    <rect x="16" y="14" width="2" height="2" />
    <rect x="16" y="16" width="2" height="2" />
    <rect x="18" y="16" width="2" height="2" />
    <!-- Palm center -->
    <rect x="6" y="16" width="4" height="10" />
    <rect x="10" y="20" width="4" height="6" />
    <rect x="14" y="20" width="4" height="6" />
    <rect x="18" y="22" width="2" height="2" />
    <!-- Thumb base -->
    <rect x="4" y="18" width="2" height="8" />
  </g>

  <!-- Retro Pink Pixel Cuff -->
  <g fill="#ea7684">
    <rect x="8" y="28" width="6" height="2" />
  </g>
</svg>
