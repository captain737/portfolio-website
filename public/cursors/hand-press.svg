<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 8-Bit Pixel Click Sparks -->
  <g fill="#ea7684">
    <rect x="6" y="0" width="2" height="2" />
    <rect x="2" y="4" width="2" height="2" />
    <rect x="12" y="2" width="2" height="2" />
    <rect x="14" y="6" width="2" height="2" />
  </g>
  <rect x="7" y="3" width="2" height="2" fill="#fde047" />

  <!-- 8-Bit Pixel Drop Shadow -->
  <g fill="#2c2a26" opacity="0.3">
    <rect x="8" y="8" width="6" height="2" />
    <rect x="6" y="10" width="10" height="6" />
    <rect x="6" y="16" width="16" height="4" />
    <rect x="4" y="20" width="18" height="6" />
    <rect x="6" y="26" width="14" height="4" />
  </g>

  <!-- Black Pixel Outline (Index finger pressed/squashed down) -->
  <g fill="#2c2a26">
    <!-- Pressed Index tip -->
    <rect x="6" y="6" width="4" height="2" />
    <!-- Index left -->
    <rect x="4" y="8" width="2" height="6" />
    <!-- Index right -->
    <rect x="10" y="8" width="2" height="4" />
    <!-- Middle finger top border -->
    <rect x="12" y="10" width="4" height="2" />
    <rect x="16" y="12" width="2" height="2" />
    <!-- Ring finger top border -->
    <rect x="18" y="14" width="2" height="2" />
    <!-- Pinky top border -->
    <rect x="20" y="16" width="2" height="4" />
    <!-- Right side border -->
    <rect x="20" y="20" width="2" height="4" />
    <!-- Bottom right curves -->
    <rect x="18" y="24" width="2" height="2" />
    <rect x="16" y="26" width="2" height="2" />
    <!-- Cuff right border -->
    <rect x="14" y="28" width="2" height="3" />
    <!-- Cuff bottom border -->
    <rect x="8" y="31" width="6" height="1" />
    <!-- Cuff left border -->
    <rect x="6" y="28" width="2" height="3" />
    <!-- Thumb bottom/left -->
    <rect x="4" y="26" width="2" height="2" />
    <rect x="2" y="22" width="2" height="4" />
    <rect x="2" y="18" width="2" height="4" />
    <rect x="4" y="16" width="2" height="2" />
    <!-- Finger dividers -->
    <rect x="10" y="14" width="2" height="6" />
    <rect x="14" y="16" width="2" height="4" />
  </g>

  <!-- Cream White Pixel Hand Fill -->
  <g fill="#fdfaf6">
    <!-- Pressed index -->
    <rect x="6" y="8" width="4" height="6" />
    <!-- Upper palm / fingers -->
    <rect x="10" y="12" width="2" height="2" />
    <rect x="12" y="12" width="4" height="4" />
    <rect x="16" y="14" width="2" height="2" />
    <rect x="16" y="16" width="2" height="2" />
    <rect x="18" y="16" width="2" height="2" />
    <!-- Palm center -->
    <rect x="6" y="14" width="4" height="10" />
    <rect x="10" y="18" width="4" height="8" />
    <rect x="14" y="20" width="4" height="6" />
    <rect x="18" y="22" width="2" height="2" />
    <!-- Thumb base -->
    <rect x="4" y="18" width="2" height="8" />
  </g>

  <!-- Retro Pink Pixel Cuff -->
  <g fill="#ea7684">
    <rect x="8" y="28" width="6" height="3" />
  </g>
</svg>
